[project]
name = "reconviagen-studio"
version = "0.1.0"
description = "Local multi-view UI backed by a Modal-hosted ReconViaGen v0.5 GPU endpoint"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "modal>=1.4.3,<2",
    "pillow>=11,<13",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", "vendor"]
